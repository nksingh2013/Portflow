services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portflow
      POSTGRES_USER: portflow_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run scripts/bootstrap-env.ps1 first}
      PORTFLOW_DB_PASSWORD: ${PORTFLOW_DB_PASSWORD:?Run scripts/bootstrap-env.ps1 first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portflow_admin -d portflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      PORTFLOW_DATABASE_URL: ${PORTFLOW_DATABASE_URL:?Run scripts/bootstrap-env.ps1 first}
      PORTFLOW_REDIS_URL: redis://redis:6379/0
      PORTFLOW_CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    env_file: .env
    environment:
      PORTFLOW_DATABASE_URL: ${PORTFLOW_DATABASE_URL:?Run scripts/bootstrap-env.ps1 first}
      PORTFLOW_REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO"]
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
